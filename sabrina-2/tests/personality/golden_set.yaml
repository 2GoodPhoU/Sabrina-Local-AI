# Personality golden set — 30 prompts × 12 failure-mode axes.
#
# Layout per entry:
#   id: g001..g030
#   prompt: what the user says
#   register: A | B | C
#   retrieval: simulated retrieval block (empty string -> none)
#   axes: list of failure modes the rubric cares about for THIS prompt
#   reference: optional "what good Sabrina would say" reference (free text)
#   notes: optional rationale / anchor citation
#
# Axes (12, named in
# `rebuild/drafts/research/2026-04-26-personality-eval-framework.md`):
#   sycophant_slip
#   customer_service
#   identity_disclaimer
#   em_dash_vomit
#   list_vomit
#   closing_question_inflation
#   hedging_inflation
#   apology_inflation
#   opinion_flattening
#   refusal_verbosity
#   memory_fabrication
#   mode_bleed
#
# Coverage targets per the research doc:
#   60% Register A, 25% B, 15% C
#   70% empty retrieval / 30% non-empty
#   ~3 prompts per failure mode

